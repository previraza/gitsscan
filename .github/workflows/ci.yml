name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Shellcheck
        run: shellcheck bin/gitss lib/*.sh install.sh uninstall.sh scripts/*.sh tests/*.sh

      - name: Formatting check
        run: shfmt -d -i 2 bin/gitss lib/*.sh install.sh uninstall.sh scripts/*.sh tests/*.sh

      - name: Smoke tests
        run: |
          ./tests/smoke.sh
          ./tests/install-deps.sh
          ./tests/missing-deps.sh
          ./tests/json-escape.sh
          ./tests/scan-mode.sh
          ./tests/workers.sh
          ./tests/bench-script.sh
          ./tests/release-assets.sh
          ./tests/homebrew-formula.sh
          ./tests/commit-push.sh
